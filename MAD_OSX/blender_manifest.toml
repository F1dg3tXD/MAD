schema_version = "1.0.0"

id = "MAD"
version = "0.1.7"
name = "MAD (Microphone Audio Driver)"
tagline = "Use your Microphone as an Animation Driver in Blender"
maintainer = "F1dg3t <f1dg3t.rah@gmail.com>"
# Supported types: "add-on", "theme"
type = "add-on"

# Optional: link to documentation, support, source files, etc
website = "https://github.com/F1dg3tXD/MAD"

# Optional: tag list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/extensions/tags.html
tags = ["Rigging", "Animation"]

blender_version_min = "5.0.0"
# Optional: maximum supported Blender version
# blender_version_max = "5.1.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX:" prefix)
# https://docs.blender.org/manual/en/dev/extensions/licenses.html
license = [
  "SPDX:GPL-3.0-or-later"
]
# Optional: required by some licenses.
# copyright = [
#   "2025 F1dg3t"
# ]

# This build is the macOS one, it needs the platform specific wheels.
# Optional: list of supported platforms. If omitted, the extension will be available in all operating systems.
platforms = ["macos-arm64", "macos-x64"]

# Optional: bundle 3rd party Python modules.
# https://docs.blender.org/manual/en/dev/extensions/python_wheels.html
# Blender installs the wheels that match its own Python version, so the wheels
# for every supported Python version have to be listed here.
# * CPython 3.11 -> Blender 5.0
# * CPython 3.13 -> Blender 5.1 and 5.2
# * CPython 3.14 -> Blender builds that ship 3.14
wheels = [
  "./wheels/pycparser-3.0-py3-none-any.whl",
  "./wheels/sounddevice-0.5.6-py3-none-macosx_10_6_x86_64.macosx_10_6_universal2.whl",
  "./wheels/cffi-2.1.1-cp311-cp311-macosx_10_15_x86_64.whl",
  "./wheels/cffi-2.1.1-cp313-cp313-macosx_10_15_x86_64.whl",
  "./wheels/cffi-2.1.1-cp314-cp314-macosx_10_15_x86_64.whl",
  "./wheels/cffi-2.1.1-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/cffi-2.1.1-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/cffi-2.1.1-cp314-cp314-macosx_11_0_arm64.whl"
]

# Optional: add-ons can list which resources they will require:
# * files (for access of any filesystem operations)
# * network (for internet access)
# * clipboard (to read and/or write the system clipboard)
# * camera (to capture photos and videos)
# * microphone (to capture audio)
#
# If using network, remember to also check `bpy.app.online_access`
# https://docs.blender.org/manual/en/dev/extensions/addons.html#internet-access
#
# For each permission it is important to also specify the reason why it is required.
# Keep this a single short sentence without a period (.) at the end.
# For longer explanations use the documentation or detail page.
[permissions]
microphone = "Capture audio input for real-time animation"
network = "Install sounddevice for macOS when the bundled wheels are not used"

# Optional: advanced build settings.
# https://docs.blender.org/manual/en/dev/extensions/command_line_arguments.html#command-line-args-extension-build
# [build]
